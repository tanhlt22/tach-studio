<section
  #stageContainer
  class="tree-stage-shell"
  aria-label="Cây kỷ niệm 3D Ngày Quốc tế Đàn Ông 19/11">

  <!-- Decorative Celebration Banner -->
  <div class="tree-banner">
    <span class="tree-banner-badge">
      <span class="badge-dot" aria-hidden="true"></span>
      19/11 • QUỐC TẾ ĐÀN ÔNG
    </span>
    <span class="tree-banner-hint">Tự động xoay • Kéo hoặc bấm nút để xoay • Chạm ảnh để xem lớn</span>
  </div>

  <!-- 3D WebGL Tree Canvas Stage -->
  <div
    #canvasHost
    class="tree-canvas-host"
    [class.tree-canvas-host--grabbing]="isDragging()"
    [class.tree-canvas-host--pointer]="hoveredPhotoIndex() !== null"
    (pointerdown)="onCanvasPointerDown($event)"
    (pointermove)="onCanvasPointerMove($event)"
    (pointerup)="onCanvasPointerUp($event)"
    (pointercancel)="onCanvasPointerUp($event)"
    (pointerleave)="onCanvasPointerLeave()">

    <!-- Decorative Flying Balloons inside Stage -->
    <div class="stage-balloons" [class.stage-balloons--paused]="!isAutoRotating()" aria-hidden="true">
      <span class="mini-balloon mini-balloon--blue mini-balloon--1"></span>
      <span class="mini-balloon mini-balloon--red mini-balloon--2"></span>
      <span class="mini-balloon mini-balloon--white mini-balloon--3"></span>
      <span class="mini-balloon mini-balloon--blue mini-balloon--4"></span>
      <span class="mini-balloon mini-balloon--red mini-balloon--5"></span>
    </div>

    <!-- Loading shimmer while realistic 3D tree initializes -->
    <div class="tree-init-overlay" *ngIf="!isSceneReady() && !webglUnavailable()">
      <div class="tree-init-spinner"></div>
      <span>Đang dựng Cây Kỷ Niệm 3D...</span>
    </div>

    <!-- Graceful Fallback if WebGL is unavailable -->
    <div class="tree-fallback-grid" *ngIf="webglUnavailable()">
      <p class="fallback-title">Bộ ảnh kỷ niệm Ngày Quốc tế Đàn Ông 19/11</p>
      <div class="fallback-cards">
        <button
          type="button"
          *ngFor="let photo of photos; let i = index"
          class="fallback-card"
          (click)="photoSelected.emit(i)">
          <img
            *ngIf="!isVideoMedia(photo)"
            [src]="getPhotoPreviewUrl(photo)"
            [alt]="getPhotoLabel(photo, i)"
            referrerpolicy="no-referrer" />
          <div class="fallback-video" *ngIf="isVideoMedia(photo)">▶ VIDEO BTS</div>
          <span>{{ getPhotoLabel(photo, i) }}</span>
        </button>
      </div>
    </div>

    <!-- Active Front Photo Quick Pill -->
    <button
      type="button"
      class="front-photo-pill"
      *ngIf="photos.length > 0 && isSceneReady() && !webglUnavailable()"
      (click)="$event.stopPropagation(); openFrontPhoto()"
      (pointerdown)="$event.stopPropagation()">
      <span class="front-pill-dot" aria-hidden="true"></span>
      <span class="front-pill-label">{{ getPhotoLabel(photos[frontPhotoIndex()], frontPhotoIndex()) }}</span>
      <span class="front-pill-cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
        </svg>
        Xem ảnh
      </span>
    </button>
  </div>

  <!-- Interactive Rotation Controls Bar -->
  <div class="tree-controls-bar" *ngIf="photos.length > 0 && !webglUnavailable()">
    <button
      type="button"
      class="tree-ctrl-btn"
      (pointerdown)="onSpinButtonDown(-1, $event)"
      (pointerup)="onSpinButtonUp(-1)"
      (pointerleave)="onSpinButtonCancel()"
      (pointercancel)="onSpinButtonCancel()"
      (click)="onSpinButtonKeyClick(-1, $event)"
      title="Xoay cây sang trái">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span>Quay trái</span>
    </button>

    <button
      type="button"
      class="tree-ctrl-btn tree-ctrl-btn--toggle"
      (click)="toggleAutoRotate()">
      <svg *ngIf="isAutoRotating()" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1" />
        <rect x="14" y="5" width="4" height="14" rx="1" />
      </svg>
      <svg *ngIf="!isAutoRotating()" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="7,5 19,12 7,19" />
      </svg>
      <span>{{ isAutoRotating() ? 'Dừng xoay' : 'Tự xoay' }}</span>
    </button>

    <button
      type="button"
      class="tree-ctrl-btn"
      (pointerdown)="onSpinButtonDown(1, $event)"
      (pointerup)="onSpinButtonUp(1)"
      (pointerleave)="onSpinButtonCancel()"
      (pointercancel)="onSpinButtonCancel()"
      (click)="onSpinButtonKeyClick(1, $event)"
      title="Xoay cây sang phải">
      <span>Quay phải</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
        <path d="M21 3v5h-5" />
      </svg>
    </button>
  </div>
</section>
